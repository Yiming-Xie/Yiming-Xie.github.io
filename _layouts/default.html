<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title != 'about' %}{{ page.title | capitalize }} | {% endif %}{{ site.title }} ({{ site.chinese_name }})</title>
<meta name="description" content="{{ site.description | escape }}">
<meta property="og:title" content="{{ site.title }} — {{ page.title | capitalize }}"><meta property="og:description" content="{{ site.description | escape }}"><meta property="og:type" content="website"><meta property="og:url" content="{{ page.url | absolute_url }}"><meta property="og:image" content="{{ '/images/avery-portrait.jpg' | absolute_url }}">
<link rel="canonical" href="{{ page.url | absolute_url }}"><link rel="icon" href="{{ '/images/favicon.ico' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<script src="{{ '/assets/js/personal.js' | relative_url }}"></script>
</head><body class="fixed-top-nav sticky-bottom-footer">
<a class="skip-link" href="#main">Skip to content</a>{% include header.html %}
<main id="main" class="container main-content">{{ content }}</main>
<footer class="sticky-bottom"><div class="container footer-inner">
<span>© {{ 'now' | date: '%Y' }} {{ site.title }}.</span>
<span class="visitor-counter" data-site-url="{{ site.url | escape }}" aria-label="Site visitors">
<span id="busuanzi_container_site_uv">Visitors <span id="busuanzi_value_site_uv">—</span></span>
</span>
</div></footer>
<script src="{{ '/assets/js/visitors.js' | relative_url }}" defer></script>
</body></html>
